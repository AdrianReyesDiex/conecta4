<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuatro en Línea</title>
<style>
  :root { --bg: #f4f1ea; --fg: #1f2328; --board: #2f3e46; --p1: #e76f51; --p2: #2a9d8f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181b; --fg: #e8e6e3; --board: #354f52; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 1rem;
         padding: 16px; background: var(--bg); color: var(--fg); font: 1.1rem system-ui, sans-serif; }
  h1 { margin: 0; font-size: 1.6rem; }
  #status { margin: 0; min-height: 1.5em; }
  .dot { display: inline-block; width: .9em; height: .9em; border-radius: 50%; vertical-align: -.1em; }
  #board { display: flex; gap: 6px; padding: 10px; width: min(92vw, 520px); background: var(--board); border-radius: 16px; }
  .col { flex: 1; display: flex; flex-direction: column-reverse; gap: 6px; padding: 0; border: 0;
         background: none; border-radius: 999px; cursor: pointer; }
  .col:hover:not(:disabled) { background: rgb(255 255 255 / .12); }
  .col:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  .col:disabled { cursor: default; }
  .cell { aspect-ratio: 1; border-radius: 50%; background: var(--bg); }
  .cell i { position: relative; z-index: 1; display: block; height: 100%; border-radius: 50%;
            animation: drop .4s ease-in; }
  .cell i.win { box-shadow: inset 0 0 0 .3em rgb(255 255 255 / .75); }
  @keyframes drop { from { transform: translateY(calc(var(--n) * (-100% - 6px))); } }
  @media (prefers-reduced-motion: reduce) { .cell i { animation: none; } }
  button.reset { font: inherit; padding: .5em 1.2em; border: 2px solid var(--fg); border-radius: 8px;
                 background: none; color: var(--fg); cursor: pointer; }
</style>
</head>
<body>
<h1>Cuatro en Línea</h1>
<p id="status" aria-live="polite"></p>
<div id="board"></div>
<button class="reset" onclick="reset()">Nueva partida</button>

<script src="game.js"></script>
<script>
  const names = ['', 'Naranja', 'Verde'];
  const dot = p => `<span class="dot" style="background:var(--p${p})"></span> ${names[p]}`;
  const boardEl = document.getElementById('board'), statusEl = document.getElementById('status');
  let board, player, over;

  for (let c = 0; c < COLS; c++) {
    const col = document.createElement('button');
    col.className = 'col';
    col.innerHTML = '<span class="cell"></span>'.repeat(ROWS);
    col.onclick = () => play(c);
    boardEl.append(col);
  }
  const cols = boardEl.children;

  function label(c) {
    const pieces = board[c].map(p => names[p]).join(', ') || 'vacía';
    cols[c].setAttribute('aria-label', `Columna ${c + 1}: ${pieces}`);
  }

  function reset() {
    board = Array.from({ length: COLS }, () => []);
    player = 1;
    over = false;
    for (let c = 0; c < COLS; c++) {
      cols[c].disabled = false;
      for (const cell of cols[c].children) cell.replaceChildren();
      label(c);
    }
    statusEl.innerHTML = `Turno: ${dot(player)}`;
  }

  function play(c) {
    if (over || board[c].length === ROWS) return;
    const r = board[c].push(player) - 1;
    const disc = document.createElement('i');
    disc.style.background = `var(--p${player})`;
    disc.style.setProperty('--n', ROWS - r);
    cols[c].children[r].append(disc);
    label(c);
    cols[c].disabled = board[c].length === ROWS;

    const line = winLine(board, c, r);
    if (line) {
      over = true;
      for (const [x, y] of line) cols[x].children[y].firstChild.classList.add('win');
      statusEl.innerHTML = `¡Gana ${dot(player)}!`;
    } else if (board.every(col => col.length === ROWS)) {
      over = true;
      statusEl.textContent = 'Empate';
    } else {
      player = 3 - player;
      statusEl.innerHTML = `Columna ${c + 1}. Turno: ${dot(player)}`;
    }
    if (over) for (const col of cols) col.disabled = true;
  }

  reset();
</script>
</body>
</html>
